{% extends "base.html" %}
{% block title %}{{ "Edit department" if department else "Add department" }}{% endblock %}

{% block content %}
<h1>{{ "Edit department" if department else "Add department" }}</h1>

{% set f = form if form is not none else {} %}

<form method="POST" class="stacked-form">
    <div class="form-grid">
        <div>
            <label for="name">Department name *</label>
            <input type="text" id="name" name="name"
                   value="{{ f.get('name', department.name if department else '') }}"
                   placeholder="e.g. Computer Science &amp; Engineering" required>
        </div>

        <div>
            <label for="code">Department code *</label>
            <input type="text" id="code" name="code"
                   value="{{ f.get('code', department.code if department else '') }}"
                   placeholder="e.g. CSE" required>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ "Save changes" if department else "Add department" }}</button>
        <a href="{{ url_for('departments.list_departments') }}" class="btn btn-link">Cancel</a>
    </div>
</form>
{% endblock %}
