{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="error-page">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Go to dashboard</a>
</div>
{% endblock %}

</div>
{% endblock %}
